schema_version: 1
questions:
  - id: q01
    category: ordinary
    question: What attendance level does the June 2026 Academic Rules Handbook require?
    expected_answerability: answerable
    expected_answer: Students are required to maintain 100% attendance; the HoD may condone up to 20% absence for genuine reasons.
    gold_evidence:
      - source: academic-rules-handbook-jun-2026.pdf
        page: 10
        section: Attendance Requirements
        document_version: 2026-06

  - id: q02
    category: ordinary
    question: How much absence may the HoD condone for genuine reasons under clause 1.21?
    expected_answerability: answerable
    expected_answer: A maximum of 20% of total attendance may be condoned.
    gold_evidence:
      - source: academic-rules-handbook-jun-2026.pdf
        page: 10
        section: Attendance Requirements
        document_version: 2026-06

  - id: q03
    category: ordinary
    question: What is the consequence of failing to meet a course's attendance requirements?
    expected_answerability: answerable
    expected_answer: The student is ineligible to appear in the final examination for that course.
    gold_evidence:
      - source: academic-rules-handbook-jun-2026.pdf
        page: 10
        section: Attendance Requirements
        document_version: 2026-06

  - id: q04
    category: ordinary
    question: What minimum CGPA is required to avoid academic warning in the June 2026 handbook?
    expected_answerability: answerable
    expected_answer: 2.00.
    gold_evidence:
      - source: academic-rules-handbook-jun-2026.pdf
        page: 24
        section: Academic Warning/Probation
        document_version: 2026-06

  - id: q05
    category: ordinary
    question: When is the academic-warning count reset after a warning?
    expected_answerability: answerable
    expected_answer: When CGPA equals or exceeds 2.00 after the first or second academic warning.
    gold_evidence:
      - source: academic-rules-handbook-jun-2026.pdf
        page: 25
        section: Page 25 (no section heading detected)
        document_version: 2026-06

  - id: q06
    category: ordinary
    question: What must a student do with a failed or missed course from a previous semester?
    expected_answerability: answerable
    expected_answer: It must be registered in the subsequent semester if offered and cannot be skipped.
    gold_evidence:
      - source: academic-rules-handbook-jun-2026.pdf
        page: 25
        section: Page 25 (no section heading detected)
        document_version: 2026-06

  - id: q07
    category: ordinary
    question: May a student repeat a course to improve CGPA under the June 2026 rules?
    expected_answerability: answerable
    expected_answer: Yes, a student may repeat any course to improve CGPA.
    gold_evidence:
      - source: academic-rules-handbook-jun-2026.pdf
        page: 25
        section: Page 25 (no section heading detected)
        document_version: 2026-06

  - id: q08
    category: ordinary
    question: What does the Student Handbook require when students submit work containing Generative AI output?
    expected_answerability: answerable
    expected_answer: Students should acknowledge and cite the source or original source.
    gold_evidence:
      - source: student-handbook-jun-2026.pdf
        page: 53
        section: Page 53 (no section heading detected)
        document_version: 2026-06

  - id: q09
    category: version-sensitive
    question: In the Annual Report 2019-20, how many faculty members are listed in the university-wide summary?
    expected_answerability: answerable
    expected_document: Annual Report 2019-20
    expected_version: 2019-20
    expected_answer: 615 faculty members.
    gold_evidence:
      - source: annual-report-2019-20.pdf
        page: 13
        section: Page 13 (no section heading detected)
        document_version: 2019-20

  - id: q10
    category: version-sensitive
    question: In the Annual Report 2023-24, what is the university-wide faculty total?
    expected_answerability: answerable
    expected_document: Annual Report 2023-24
    expected_version: 2023-24
    expected_answer: 735 faculty members.
    gold_evidence:
      - source: annual-report-2023-24.pdf
        page: 13
        section: Page 13 (no section heading detected)
        document_version: 2023-24

  - id: q11
    category: exact-term
    question: Which clause number in the June 2026 Academic Rules Handbook contains the attendance requirement?
    expected_answerability: answerable
    expected_answer: Clause 1.21.
    gold_evidence:
      - source: academic-rules-handbook-jun-2026.pdf
        page: 10
        section: Attendance Requirements
        document_version: 2026-06

  - id: q12
    category: exact-term
    question: What is the exact title of Section XII in the June 2026 Student Handbook?
    expected_answerability: answerable
    expected_answer: Policy on Generative AI Based Tools.
    gold_evidence:
      - source: student-handbook-jun-2026.pdf
        page: 48
        section: Page 48 (no section heading detected)
        document_version: 2026-06

