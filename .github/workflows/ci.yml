name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python lint and types
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements*.txt
            indexer/requirements*.txt
      - name: Install lint and type-check dependencies
        run: |
          python -m pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - name: Ruff
        run: ruff check api indexer eval corpus
      - name: Mypy API
        working-directory: api
        run: mypy app
      - name: Mypy indexer
        working-directory: indexer
        run: mypy pipeline

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    env:
      RETRIEVER: stub
      LLM_PROVIDER: stub
      OLLAMA_URL: http://127.0.0.1:9
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements*.txt
            indexer/requirements*.txt
      - name: Install test dependencies
        run: |
          python -m pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
          python -m pip install coverage==7.6.12 pyyaml==6.0.2
      - name: API tests and application-package coverage
        working-directory: api
        run: |
          coverage run --data-file=/tmp/api-coverage --source=app -m pytest -q
          coverage report --data-file=/tmp/api-coverage --fail-under=60
      - name: Indexer tests and application-package coverage
        working-directory: indexer
        run: |
          coverage run --data-file=/tmp/indexer-coverage --source=pipeline -m pytest -q
          coverage report --data-file=/tmp/indexer-coverage --fail-under=60
      - name: Evaluation tooling tests
        run: python -m pytest -q eval

  manifests:
    name: Production manifests and workflow syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Kustomize and kubeconform
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz \
            -o /tmp/kustomize.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp kustomize
          curl --fail --location --silent --show-error \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            -o /tmp/kubeconform.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          echo "/tmp" >> "$GITHUB_PATH"
      - name: Build and strictly validate production manifests
        run: |
          kustomize build k8s/overlays/prod > /tmp/rahbar-prod.yaml
          kubeconform -strict -summary -kubernetes-version 1.32.0 /tmp/rahbar-prod.yaml
      - name: Validate workflow syntax
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint .github/workflows/ci.yml

  build:
    name: Build local images
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build API image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./api
          push: false
          load: true
          tags: rahbar-api:dev
          cache-from: type=gha,scope=rahbar-api
          cache-to: type=gha,scope=rahbar-api,mode=max
      - name: Build indexer image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./indexer
          push: false
          load: true
          tags: rahbar-indexer:dev
          cache-from: type=gha,scope=rahbar-indexer
          cache-to: type=gha,scope=rahbar-indexer,mode=max
      - name: Build UI image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./ui
          push: false
          load: true
          tags: rahbar-ui:dev
          cache-from: type=gha,scope=rahbar-ui
          cache-to: type=gha,scope=rahbar-ui,mode=max
      - name: Save built images for scan and e2e jobs
        run: |
          docker save --output rahbar-api.tar rahbar-api:dev
          docker save --output rahbar-indexer.tar rahbar-indexer:dev
          docker save --output rahbar-ui.tar rahbar-ui:dev
      - name: Upload built images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rahbar-ci-images
          path: |
            rahbar-api.tar
            rahbar-indexer.tar
            rahbar-ui.tar
          if-no-files-found: error
          retention-days: 1

  scan:
    name: Scan built images
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download built images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rahbar-ci-images
      - name: Install pinned Trivy
        run: |
          set -euo pipefail
          docker pull ghcr.io/aquasecurity/trivy:0.59.1
          trivy_container="$(docker create ghcr.io/aquasecurity/trivy:0.59.1)"
          trap 'docker rm -f "$trivy_container" >/dev/null' EXIT
          docker cp "$trivy_container:/usr/local/bin/trivy" /tmp/trivy
          chmod 0755 /tmp/trivy
          /tmp/trivy --version
      - name: Scan API image
        run: /tmp/trivy image --input rahbar-api.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
      - name: Scan indexer image
        run: /tmp/trivy image --input rahbar-indexer.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
      - name: Scan UI image
        run: /tmp/trivy image --input rahbar-ui.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress

  e2e-eval:
    name: Fixture indexing and evaluation
    needs:
      - build
      - manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install fixture evaluator dependencies
        run: python -m pip install httpx==0.28.1 pyyaml==6.0.2
      - name: Download application images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rahbar-ci-images
      - name: Load application images and build fixture embedding service
        run: |
          docker load --input rahbar-api.tar
          docker load --input rahbar-indexer.tar
          docker load --input rahbar-ui.tar
          docker build --tag rahbar-fixture-embed:ci \
            --file eval/fixtures/Dockerfile eval/fixtures
      - name: Install pinned kind and kubectl
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64 \
            -o /tmp/kind
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          curl --fail --location --silent --show-error \
            https://dl.k8s.io/release/v1.32.3/bin/linux/amd64/kubectl \
            -o /tmp/kubectl
          chmod +x /tmp/kubectl
          sudo mv /tmp/kubectl /usr/local/bin/kubectl
      - name: Create isolated kind cluster and load local images
        run: |
          kind create cluster --name rahbar-ci --wait 120s
          kind load docker-image --name rahbar-ci \
            rahbar-api:dev rahbar-indexer:dev rahbar-ui:dev rahbar-fixture-embed:ci
      - name: Apply the CI-only fixture overlay
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl create configmap rahbar-fixture-corpus --namespace rahbar \
            --from-file=academic-rules-2023.md=eval/fixtures/academic-rules-2023.md \
            --from-file=academic-rules-2026.md=eval/fixtures/academic-rules-2026.md \
            --from-file=fees-2026.md=eval/fixtures/fees-2026.md \
            --dry-run=client --output yaml | kubectl apply --filename -
          kubectl apply -k k8s/overlays/ci
      - name: Run real fixture indexer and wait for application rollouts
        run: |
          kubectl wait --namespace rahbar --for=condition=ready pod -l app=chroma --timeout=5m
          kubectl wait --namespace rahbar --for=condition=ready pod -l app=redis --timeout=5m
          kubectl wait --namespace rahbar --for=condition=ready pod -l app=ollama-fixture --timeout=5m
          kubectl wait --namespace rahbar --for=condition=complete job/indexer --timeout=10m
          kubectl rollout status --namespace rahbar statefulset/chroma --timeout=5m
          kubectl rollout status --namespace rahbar deployment/redis --timeout=5m
          kubectl rollout status --namespace rahbar deployment/api --timeout=5m
          kubectl rollout status --namespace rahbar deployment/ui --timeout=5m
      - name: Exercise the UI and evaluate the live API
        run: |
          set -euo pipefail
          kubectl port-forward --namespace rahbar service/api 18000:8000 \
            >/tmp/rahbar-api-port-forward.log 2>&1 &
          echo "$!" > /tmp/rahbar-api-port-forward.pid
          kubectl port-forward --namespace rahbar service/ui 18080:8080 \
            >/tmp/rahbar-ui-port-forward.log 2>&1 &
          echo "$!" > /tmp/rahbar-ui-port-forward.pid
          attempt=0
          while [ "$attempt" -lt 30 ]; do
            if curl --fail --silent http://127.0.0.1:18000/readyz >/dev/null \
              && curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            attempt=$((attempt + 1))
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/ >/dev/null
          python eval/run_eval.py \
            --api http://127.0.0.1:18000 \
            --golden eval/fixtures/golden.fixture.yaml \
            --out /tmp/rahbar-fixture-results.json \
            --baseline eval/fixtures/quality-target.json \
            --timeout 30
      - name: Show cluster diagnostics on failure
        if: failure()
        run: |
          kubectl get all,pvc,networkpolicy --namespace rahbar || true
          kubectl describe jobs --namespace rahbar || true
          kubectl logs job/indexer --namespace rahbar --all-containers=true || true
          kubectl logs deployment/api --namespace rahbar --all-containers=true || true
      - name: Delete ephemeral kind cluster
        if: always()
        run: kind delete cluster --name rahbar-ci
