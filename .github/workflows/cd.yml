name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Tests and fixture evaluation gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RETRIEVER: stub
      LLM_PROVIDER: stub
      OLLAMA_URL: http://127.0.0.1:9
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements*.txt
            indexer/requirements*.txt

      - name: Install test, lint, type-check, and evaluator dependencies
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
          python -m pip install coverage==7.6.12 pyyaml==6.0.2

      - name: Ruff
        run: python -m ruff check api indexer eval corpus

      - name: Mypy API
        working-directory: api
        run: python -m mypy app

      - name: Mypy indexer
        working-directory: indexer
        run: python -m mypy pipeline

      - name: API tests and application-package coverage
        working-directory: api
        run: |
          set -euo pipefail
          python -m coverage run --data-file=/tmp/api-coverage --source=app -m pytest -q
          python -m coverage report --data-file=/tmp/api-coverage --fail-under=60

      - name: Indexer tests and application-package coverage
        working-directory: indexer
        run: |
          set -euo pipefail
          python -m coverage run --data-file=/tmp/indexer-coverage --source=pipeline -m pytest -q
          python -m coverage report --data-file=/tmp/indexer-coverage --fail-under=60

      - name: Evaluation tooling tests
        run: python -m pytest -q eval

      - name: Build application and fixture images
        run: |
          set -euo pipefail
          docker build --tag rahbar-api:dev api
          docker build --tag rahbar-indexer:dev indexer
          docker build --tag rahbar-ui:dev ui
          docker build --tag rahbar-fixture-embed:ci --file eval/fixtures/Dockerfile eval/fixtures

      - name: Install pinned kind and kubectl
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64 \
            --output /tmp/kind
          echo 'a6875aaea358acf0ac07786b1a6755d08fd640f4c79b7a2e46681cc13f49a04b  /tmp/kind' \
            | sha256sum --check -
          chmod 0755 /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          curl --fail --location --silent --show-error \
            https://dl.k8s.io/release/v1.32.3/bin/linux/amd64/kubectl \
            --output /tmp/kubectl
          echo 'ab209d0c5134b61486a0486585604a616a5bb2fc07df46d304b3c95817b2d79f  /tmp/kubectl' \
            | sha256sum --check -
          chmod 0755 /tmp/kubectl
          sudo mv /tmp/kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client

      - name: Create isolated kind cluster and load test images
        run: |
          set -euo pipefail
          kind create cluster --name rahbar-cd-test \
            --image kindest/node:v1.32.2@sha256:f226345927d7e348497136874b6d207e0b32cc52154ad8323129352923a3142f \
            --wait 120s
          kind load docker-image --name rahbar-cd-test \
            rahbar-api:dev rahbar-indexer:dev rahbar-ui:dev rahbar-fixture-embed:ci

      - name: Apply isolated fixture stack
        run: |
          set -euo pipefail
          kubectl apply --filename k8s/base/namespace.yaml
          kubectl create configmap rahbar-fixture-corpus --namespace rahbar \
            --from-file=academic-rules-2023.md=eval/fixtures/academic-rules-2023.md \
            --from-file=academic-rules-2026.md=eval/fixtures/academic-rules-2026.md \
            --from-file=fees-2026.md=eval/fixtures/fees-2026.md \
            --dry-run=client --output yaml | kubectl apply --filename -
          kubectl apply --kustomize k8s/overlays/ci

      - name: Index fixtures and wait for application rollouts
        run: |
          set -euo pipefail
          kubectl wait --namespace rahbar --for=condition=ready pod -l app=chroma --timeout=5m
          kubectl wait --namespace rahbar --for=condition=ready pod -l app=redis --timeout=5m
          kubectl wait --namespace rahbar --for=condition=ready pod -l app=ollama-fixture --timeout=5m
          kubectl wait --namespace rahbar --for=condition=complete job/indexer --timeout=10m
          kubectl rollout status --namespace rahbar statefulset/chroma --timeout=5m
          kubectl rollout status --namespace rahbar deployment/redis --timeout=5m
          kubectl rollout status --namespace rahbar deployment/api --timeout=5m
          kubectl rollout status --namespace rahbar deployment/ui --timeout=5m

      - name: Run section 5.4 gate against the fixture-specific baseline
        run: |
          set -euo pipefail
          kubectl port-forward --namespace rahbar service/api 18000:8000 \
            >/tmp/rahbar-cd-test-api-port-forward.log 2>&1 &
          echo "$!" > /tmp/rahbar-cd-test-api-port-forward.pid
          attempt=0
          while [ "$attempt" -lt 30 ]; do
            if curl --fail --silent http://127.0.0.1:18000/readyz >/dev/null; then
              break
            fi
            attempt=$((attempt + 1))
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:18000/readyz >/dev/null
          # This fixture gate uses the fixture-specific target, never the full-corpus baseline.
          python eval/run_eval.py \
            --api http://127.0.0.1:18000 \
            --golden eval/fixtures/golden.fixture.yaml \
            --out /tmp/rahbar-cd-fixture-results.json \
            --baseline eval/fixtures/quality-target.json \
            --timeout 30

      - name: Show test cluster diagnostics on failure
        if: failure()
        run: |
          kubectl get all,pvc,ingress,networkpolicy --namespace rahbar || true
          kubectl describe pods --namespace rahbar || true
          kubectl logs job/indexer --namespace rahbar --all-containers=true || true
          kubectl logs deployment/api --namespace rahbar --all-containers=true || true
          if [ -f /tmp/rahbar-cd-test-api-port-forward.log ]; then
            cat /tmp/rahbar-cd-test-api-port-forward.log
          fi

      - name: Delete test kind cluster
        if: always()
        run: |
          if command -v kind >/dev/null 2>&1; then
            kind delete cluster --name rahbar-cd-test
          fi

  build-push:
    name: Build and push SHA-tagged images
    needs:
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      api_image: ${{ steps.image-tags.outputs.api }}
      indexer_image: ${{ steps.image-tags.outputs.indexer }}
      ui_image: ${{ steps.image-tags.outputs.ui }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set image references
        id: image-tags
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME" || { echo "DOCKERHUB_USERNAME is required" >&2; exit 1; }
          echo "api=${DOCKERHUB_USERNAME}/rahbar-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "indexer=${DOCKERHUB_USERNAME}/rahbar-indexer:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "ui=${DOCKERHUB_USERNAME}/rahbar-ui:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME" || { echo "DOCKERHUB_USERNAME is required" >&2; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "DOCKERHUB_TOKEN is required" >&2; exit 1; }
          printf '%s' "$DOCKERHUB_TOKEN" \
            | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push API image
        env:
          IMAGE: ${{ steps.image-tags.outputs.api }}
        run: |
          set -euo pipefail
          docker build --tag "$IMAGE" api
          docker push "$IMAGE"

      - name: Build and push indexer image
        env:
          IMAGE: ${{ steps.image-tags.outputs.indexer }}
        run: |
          set -euo pipefail
          docker build --tag "$IMAGE" indexer
          docker push "$IMAGE"

      - name: Build and push UI image
        env:
          IMAGE: ${{ steps.image-tags.outputs.ui }}
        run: |
          set -euo pipefail
          docker build --tag "$IMAGE" ui
          docker push "$IMAGE"

      - name: Show local image diagnostics on failure
        if: failure()
        run: docker image ls --all

      - name: Log out of Docker Hub
        if: always()
        run: docker logout

  deploy:
    name: Deploy and smoke-test ephemeral kind
    needs:
      - build-push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      API_IMAGE: ${{ needs.build-push.outputs.api_image }}
      INDEXER_IMAGE: ${{ needs.build-push.outputs.indexer_image }}
      UI_IMAGE: ${{ needs.build-push.outputs.ui_image }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build fixture embedding image
        run: |
          set -euo pipefail
          docker build --tag rahbar-fixture-embed:ci \
            --file eval/fixtures/Dockerfile eval/fixtures

      - name: Install pinned kind and kubectl
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64 \
            --output /tmp/kind
          echo 'a6875aaea358acf0ac07786b1a6755d08fd640f4c79b7a2e46681cc13f49a04b  /tmp/kind' \
            | sha256sum --check -
          chmod 0755 /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          curl --fail --location --silent --show-error \
            https://dl.k8s.io/release/v1.32.3/bin/linux/amd64/kubectl \
            --output /tmp/kubectl
          echo 'ab209d0c5134b61486a0486585604a616a5bb2fc07df46d304b3c95817b2d79f  /tmp/kubectl' \
            | sha256sum --check -
          chmod 0755 /tmp/kubectl
          sudo mv /tmp/kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client

      - name: Download and verify pinned kind Ingress controller manifest
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.1/deploy/static/provider/kind/deploy.yaml \
            --output /tmp/ingress-nginx-kind.yaml
          echo 'cb84b0ea747c9149cce08aef4e95b1e55f183f07299f40e7009043e960a0133f  /tmp/ingress-nginx-kind.yaml' \
            | sha256sum --check -

      - name: Create ephemeral kind cluster with Ingress port mapping
        run: |
          set -euo pipefail
          cat > /tmp/rahbar-kind-config.yaml <<'YAML'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              image: kindest/node:v1.32.2@sha256:f226345927d7e348497136874b6d207e0b32cc52154ad8323129352923a3142f
              extraPortMappings:
                - containerPort: 80
                  hostPort: 18080
                  protocol: TCP
          YAML
          kind create cluster --name rahbar-cd --config /tmp/rahbar-kind-config.yaml --wait 120s
          kubectl label node rahbar-cd-control-plane ingress-ready=true

      - name: Pull and load the exact published image tags
        run: |
          set -euo pipefail
          test -n "$API_IMAGE" || { echo "API_IMAGE is required" >&2; exit 1; }
          test -n "$INDEXER_IMAGE" || { echo "INDEXER_IMAGE is required" >&2; exit 1; }
          test -n "$UI_IMAGE" || { echo "UI_IMAGE is required" >&2; exit 1; }
          test -n "$DOCKERHUB_USERNAME" || { echo "DOCKERHUB_USERNAME is required" >&2; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "DOCKERHUB_TOKEN is required" >&2; exit 1; }
          printf '%s' "$DOCKERHUB_TOKEN" \
            | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker pull "$API_IMAGE"
          docker pull "$INDEXER_IMAGE"
          docker pull "$UI_IMAGE"
          kind load docker-image --name rahbar-cd \
            "$API_IMAGE" "$INDEXER_IMAGE" "$UI_IMAGE" rahbar-fixture-embed:ci

      - name: Install pinned NGINX Ingress controller
        run: |
          set -euo pipefail
          kubectl apply --filename /tmp/ingress-nginx-kind.yaml
          if ! kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s; then
            kubectl get pods --namespace ingress-nginx \
              --selector=app.kubernetes.io/component=controller \
              --output=wide || true
            kubectl describe pods --namespace ingress-nginx \
              --selector=app.kubernetes.io/component=controller || true
            kubectl logs --namespace ingress-nginx \
              --selector=app.kubernetes.io/component=controller \
              --all-containers=true --prefix=true || true
            kubectl get events --namespace ingress-nginx \
              --sort-by=.lastTimestamp || true
            exit 1
          fi

      - name: Apply fixture-backed manifests with published image overrides
        run: |
          set -euo pipefail
          kubectl apply --filename k8s/base/namespace.yaml
          kubectl create configmap rahbar-fixture-corpus --namespace rahbar \
            --from-file=academic-rules-2023.md=eval/fixtures/academic-rules-2023.md \
            --from-file=academic-rules-2026.md=eval/fixtures/academic-rules-2026.md \
            --from-file=fees-2026.md=eval/fixtures/fees-2026.md \
            --dry-run=client --output yaml | kubectl apply --filename -
          overlay_dir="$(mktemp -d "${GITHUB_WORKSPACE}/k8s/overlays/cd.XXXXXX")"
          trap 'rm -rf "$overlay_dir"' EXIT
          cat > "${overlay_dir}/kustomization.yaml" <<YAML
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../ci
          images:
            - name: rahbar-api
              newName: ${DOCKERHUB_USERNAME}/rahbar-api
              newTag: ${GITHUB_SHA}
            - name: rahbar-indexer
              newName: ${DOCKERHUB_USERNAME}/rahbar-indexer
              newTag: ${GITHUB_SHA}
            - name: rahbar-ui
              newName: ${DOCKERHUB_USERNAME}/rahbar-ui
              newTag: ${GITHUB_SHA}
          patches:
            - target:
                group: batch
                version: v1
                kind: Job
                name: indexer
                namespace: rahbar
              patch: |-
                - op: add
                  path: /spec/template/spec/initContainers
                  value:
                    - name: wait-for-fixture-embedding
                      image: ${INDEXER_IMAGE}
                      imagePullPolicy: IfNotPresent
                      command:
                        - python
                        - -c
                        - |-
                          import time
                          import urllib.request
                          url = "http://ollama-fixture:8081/healthz"
                          deadline = time.monotonic() + 180
                          while time.monotonic() < deadline:
                              try:
                                  urllib.request.urlopen(url, timeout=2).read()
                                  break
                              except Exception:
                                  time.sleep(2)
                          else:
                              raise SystemExit("fixture embedding server did not become ready")
          YAML
          kubectl apply --kustomize "$overlay_dir"

      - name: Index fixtures and wait for application rollouts
        run: |
          set -euo pipefail
          kubectl wait --namespace rahbar --for=condition=ready pod -l app=chroma --timeout=5m
          kubectl wait --namespace rahbar --for=condition=ready pod -l app=redis --timeout=5m
          kubectl wait --namespace rahbar --for=condition=ready pod -l app=ollama-fixture --timeout=5m
          kubectl wait --namespace rahbar --for=condition=complete job/indexer --timeout=10m
          kubectl rollout status --namespace rahbar statefulset/chroma --timeout=5m
          kubectl rollout status --namespace rahbar deployment/redis --timeout=5m
          kubectl rollout status --namespace rahbar deployment/api --timeout=5m
          kubectl rollout status --namespace rahbar deployment/ui --timeout=5m
          kubectl wait --namespace rahbar \
            --for=jsonpath='{.subsets[0].addresses[0].ip}' \
            endpoints/api --timeout=2m

      - name: Smoke-test UI and API through Ingress
        run: |
          set -euo pipefail
          ingress_url=http://rahbar.local:18080
          attempt=0
          while [ "$attempt" -lt 30 ]; do
            if curl --fail --silent --connect-timeout 3 --max-time 10 \
              --resolve rahbar.local:18080:127.0.0.1 \
              "${ingress_url}/healthz" >/dev/null; then
              break
            fi
            attempt=$((attempt + 1))
            sleep 2
          done
          curl --fail --silent --show-error --connect-timeout 3 --max-time 10 \
            --resolve rahbar.local:18080:127.0.0.1 \
            "${ingress_url}/" >/dev/null
          api_smoke_status=000
          attempt=0
          api_smoke_deadline=$(( $(date +%s) + 60 ))
          while [ "$attempt" -lt 30 ] && [ "$(date +%s)" -lt "$api_smoke_deadline" ]; do
            api_smoke_remaining=$(( api_smoke_deadline - $(date +%s) ))
            if [ "$api_smoke_remaining" -le 0 ]; then
              break
            fi
            api_smoke_max_time=10
            if [ "$api_smoke_remaining" -lt "$api_smoke_max_time" ]; then
              api_smoke_max_time="$api_smoke_remaining"
            fi
            api_smoke_status="$(
              curl --silent --show-error --connect-timeout 3 \
                --max-time "$api_smoke_max_time" \
                --resolve rahbar.local:18080:127.0.0.1 \
                --header 'Content-Type: application/json' \
                --data '{"question":"When is a student placed on academic warning?"}' \
                --write-out '%{http_code}' \
                --output /tmp/rahbar-ingress-api-smoke.json \
                "${ingress_url}/api/ask" || true
            )"
            if [ "$api_smoke_status" = "200" ]; then
              break
            fi
            attempt=$((attempt + 1))
            api_smoke_remaining=$(( api_smoke_deadline - $(date +%s) ))
            if [ "$api_smoke_remaining" -le 0 ]; then
              break
            fi
            api_smoke_sleep=2
            if [ "$api_smoke_remaining" -lt "$api_smoke_sleep" ]; then
              api_smoke_sleep="$api_smoke_remaining"
            fi
            sleep "$api_smoke_sleep"
          done
          if [ "$api_smoke_status" != "200" ]; then
            echo "Ingress API smoke test returned HTTP $api_smoke_status" >&2
            echo "Response body:" >&2
            cat /tmp/rahbar-ingress-api-smoke.json >&2 || true
            echo "API endpoints:" >&2
            kubectl get endpoints api --namespace rahbar --output yaml || true
            echo "API pod logs:" >&2
            kubectl logs deployment/api --namespace rahbar --all-containers=true || true
            exit 1
          fi
          python -c "import json; d=json.load(open('/tmp/rahbar-ingress-api-smoke.json', encoding='utf-8')); assert d.get('request_id') and d.get('answered_from_context') is True and d.get('retrieved') and d.get('citations'), d; print('Ingress API smoke test passed:', d['request_id'])"

      - name: Show deployment cluster diagnostics on failure
        if: failure()
        run: |
          kubectl get all,pvc,ingress,networkpolicy --all-namespaces || true
          kubectl describe pods --namespace rahbar || true
          kubectl describe deployment/ollama-fixture --namespace rahbar || true
          kubectl logs deployment/ollama-fixture --namespace rahbar --all-containers=true || true
          kubectl describe job/indexer --namespace rahbar || true
          kubectl describe ingress --namespace rahbar || true
          kubectl logs job/indexer --namespace rahbar --all-containers=true || true
          kubectl get events --namespace rahbar --sort-by=.lastTimestamp || true
          kubectl logs deployment/api --namespace rahbar --all-containers=true || true
          kubectl logs deployment/ingress-nginx-controller --namespace ingress-nginx --all-containers=true || true

      - name: Log out of Docker Hub
        if: always()
        run: docker logout

      - name: Delete ephemeral kind cluster
        if: always()
        run: |
          if command -v kind >/dev/null 2>&1; then
            kind delete cluster --name rahbar-cd
          fi
