apiVersion: batch/v1
kind: CronJob
metadata:
  name: reindex
  namespace: rahbar
spec:
  schedule: "0 3 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        metadata:
          labels:
            app: indexer
        spec:
          serviceAccountName: indexer
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
            - name: indexer
              image: rahbar-indexer:dev
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: rahbar-config
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 3Gi
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: corpus
                  mountPath: /corpus
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: corpus
              hostPath:
                path: /mnt/rahbar-corpus
                type: Directory
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
