apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-fixture-embedding
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: ollama-fixture
      ports:
        - protocol: TCP
          port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-indexer-fixture-embedding
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app: indexer
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: ollama-fixture
      ports:
        - protocol: TCP
          port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fixture-embedding-ingress
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app: ollama-fixture
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: indexer
      ports:
        - protocol: TCP
          port: 8081
