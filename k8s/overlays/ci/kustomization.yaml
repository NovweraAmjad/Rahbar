apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - embedding-server.yaml
  - embedding-networkpolicy.yaml
patches:
  - path: configmap-patch.yaml
  - target:
      group: batch
      version: v1
      kind: Job
      name: indexer
      namespace: rahbar
    patch: |-
      - op: remove
        path: /spec/template/spec/volumes/0/hostPath
      - op: add
        path: /spec/template/spec/volumes/0/configMap
        value:
          name: rahbar-fixture-corpus
