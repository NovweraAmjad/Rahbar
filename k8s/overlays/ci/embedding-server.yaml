apiVersion: v1
kind: Service
metadata:
  name: ollama-fixture
  namespace: rahbar
spec:
  type: ClusterIP
  selector:
    app: ollama-fixture
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-fixture
  namespace: rahbar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-fixture
  template:
    metadata:
      labels:
        app: ollama-fixture
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: embedding-server
          image: rahbar-fixture-embed:ci
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
