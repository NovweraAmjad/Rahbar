apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-candidate-api-ingress
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app: api-candidate
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: part-b-candidate
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-candidate-api-egress
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app: api-candidate
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: chroma
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - ipBlock:
            cidr: 172.23.112.1/32
      ports:
        - protocol: TCP
          port: 11434
---
