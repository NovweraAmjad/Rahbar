apiVersion: v1
kind: Service
metadata:
  name: api-candidate
  namespace: rahbar
spec:
  type: ClusterIP
  selector:
    app: api-candidate
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-candidate
  namespace: rahbar
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api-candidate
  template:
    metadata:
      labels:
        app: api-candidate
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: docker.io/library/rahbar-api@sha256:73da6dcefcccb44b641779cfd13d8e8e3be3b253a29368b78bdd88726a00ac2f
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: rahbar-candidate-config
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: indexer-data
              mountPath: /var/lib/rahbar-data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: indexer-data
          persistentVolumeClaim:
            claimName: rahbar-indexer-data
