apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-candidate-config
  namespace: rahbar
immutable: true
data:
  RETRIEVER: chroma
  LLM_PROVIDER: ollama-host
  EMBED_MODEL: nomic-embed-text
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: rahbar-candidate-pass
  TOP_K: "5"
  RELEVANCE_FLOOR: "0.5"
  REDIS_URL: redis://redis:6379/0
  CACHE_PREFIX: rahbar:semantic-cache:candidate-pass
  CACHE_SIMILARITY_THRESHOLD: "0.95"
  TEMPERATURE: "0.2"
  LLM_MODEL: llama3.2:3b
  OLLAMA_URL: http://172.23.112.1:11434
  LOG_LEVEL: INFO
  CORPUS_DIR: /corpus
  TRACE_FILE: /var/lib/rahbar-data/candidate-pass/traces/queries.jsonl
  INDEXER_STATE_DIR: /var/lib/rahbar-data/candidate-pass/indexer-state
  QUARANTINE_DIR: /var/lib/rahbar-data/candidate-pass/quarantine
  VERIFICATION_REPORT_DIR: /var/lib/rahbar-data/candidate-pass/verification-reports
  ARCHIVE_DIR: /var/lib/rahbar-data/candidate-pass/archive
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
